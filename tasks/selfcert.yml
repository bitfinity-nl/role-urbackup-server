---
- name: Check if certificate file exists
  ansible.builtin.stat:
    path: /etc/apache2/ssl/urbackup.crt
  register: cert_file

- name: Get certificate expiration date
  ansible.builtin.command:
    cmd: openssl x509 -enddate -noout -in /etc/apache2/ssl/urbackup.crt
  register: cert_expiry_raw
  when: cert_file.stat.exists
  changed_when: false

- name: Parse expiration date and check if it expires within 30 days
  ansible.builtin.set_fact:
    needs_new_cert: >-
      {{ 
        not cert_file.stat.exists or 
        (cert_expiry_raw.stdout.split('=')[1] | to_datetime('%b %d %H:%M:%S %Y %Z')) < 
        (ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ') + pavilion_timedelta(days=30))
      }}
  vars:
    # Helper to calculate 30 days in seconds if your Ansible version doesn't support complex timedeltas
    expire_threshold_seconds: "{{ 30 * 84600 }}"
  when: cert_file.stat.exists

- name: Create the directory for SSL certificates
  ansible.builtin.file:
    path: /etc/apache2/ssl
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Generate a new ECDSA Private Key if needed
  ansible.builtin.command:
    cmd: openssl ecparam -genkey -name secp384r1 -out /etc/apache2/ssl/urbackup.key
  when: not cert_file.stat.exists or needs_new_cert
  args:
    creates: /etc/apache2/ssl/urbackup.key

- name: Secure the private key file permissions
  ansible.builtin.file:
    path: /etc/apache2/ssl/urbackup.key
    owner: root
    group: root
    mode: '0600'

- name: Generate or renew the self-signed ECDSA certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes 
      -key /etc/apache2/ssl/urbackup.key 
      -sha384 -days 365 
      -out /etc/apache2/ssl/urbackup.crt 
      -subj "/C=NL/ST=Limburg/L=Reuver/O=IT/CN={{ ansible_fqdn }}"
  when: not cert_file.stat.exists or needs_new_cert
  #notify: restart apache2
