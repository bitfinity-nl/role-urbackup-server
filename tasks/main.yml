# Author: Bitfinity / L. Rutten
# Owner: Bitfinity / L. Rutten
#
# File: tasks/main.yml
#
# Description:
#   Playbook for UrBackup server
#   on a Ubuntu server.
#




- name: "Mount NFS path for UrBackup"
  ansible.posix.mount:
    src: "{{ urbackup_nfs_path}}"
    path: "{{ urbackup_backup_path }}"
    opts: defaults
    state: mounted
    fstype: nfs4

- name: "Install UrBackup server docker on host"
  include_tasks: docker/01-urbackup-server-docker.yml
  when: urbackup_docker_docker == 'true'
  
- name: "Install UrBackup server"
  include_tasks: apt/01-urbackup-server.yml
  when: urbackup_docker_docker == 'false'
  
- name: "Install and configure UFW Firewall for UrBackup server"
  include_tasks: 03-firewall.yml
